name: Recompile for Android

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link direto do jogo Xbox 360"
        required: true
        type: string
        default: "https://download2393.mediafire.com/b7kgzwaef0egozKKxpDUp9ynHoW3loUHnC7Yg5RhG7_htzTAnJY5qC1pQinMiJ0-Uo0Sd4FZu6G3MtpVxujq8IoUV4AD-NWYUJMMatrlpDGQWQDaufJguRuWCznILI_GX2nT5P6l9QOzhoewrJs_KGvkGxOXBhO4WQ80l-hXvREX/ubdhf5n6eud48u2/DBX-XEX.rar"
      name:
        description: "Nome do projeto e APK"
        required: true
        type: string
        default: "db_xenoverse_recomp"
      password:
        description: "Password to extract archive"
        required: false
        type: string
        default: "LegionGamesGod"
      baseline_arm:
        description: "Build for ARMv8.0"
        required: false
        type: boolean
        default: false
      runheal:
        description: "Run the Windows run-heal loop"
        required: false
        type: boolean
        default: false
      heal_iters:
        description: "Max run-heal iterations"
        required: false
        type: string
        default: "4"

run-name: "Android: ${{ inputs.name }}"

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.name }}
  cancel-in-progress: false

jobs:
  recompile:
    name: "Codegen + static heal (Windows)"
    runs-on: windows-latest
    timeout-minutes: 350
    outputs:
      project_name: ${{ steps.prep.outputs.project_name }}
      title: ${{ steps.meta.outputs.title }}
      title_id: ${{ steps.meta.outputs.title_id }}
    env:
      REXAUTO_WORK: ${{ github.workspace }}\autoports
      REXAUTO_PORTABLE: "1"
      ARCHIVE_PASSWORD: ${{ inputs.password || 'LegionGamesGod' }}
      EXTRACT_PASSWORD: ${{ inputs.password || 'LegionGamesGod' }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare inputs and Windows toolchain
        id: prep
        env:
          GAME_URL: ${{ inputs.url }}
          RAW_NAME: ${{ inputs.name }}
        run: python tools/ci_main.py prepare-windows

      - uses: actions/cache@v4
        id: sdk-cache
        with:
          path: rexglue
          key: rexglue-sdk-${{ hashFiles('rexauto.py', 'tools/ci_sdk.py') }}-${{ steps.prep.outputs.sdk_url }}

      - name: Install and verify ReXGlue SDK
        env:
          CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
          REXGLUE_BUNDLE_URL: ${{ steps.prep.outputs.sdk_url }}
        run: python tools/ci_main.py setup-sdk

      - name: Download and extract game input
        id: fetch
        env:
          GAME_URL: ${{ inputs.url }}
        run: python tools/ci_main.py fetch

      - name: Recompile game
        env:
          CONTAINER: ${{ steps.fetch.outputs.container }}
          RUNHEAL: ${{ inputs.runheal }}
          HEAL_ITERS: ${{ inputs.heal_iters }}
        run: python tools/ci_main.py recompile

      - name: Extract metadata and pack port
        id: meta
        env:
          CONTAINER: ${{ steps.fetch.outputs.container }}
        run: python tools/ci_main.py pack-port

      - uses: actions/upload-artifact@v4
        with:
          name: port-src-${{ steps.prep.outputs.project_name }}
          path: |
            ${{ runner.temp }}/port-src.zip
            ${{ runner.temp }}/cover.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-${{ steps.prep.outputs.project_name }}
          path: ${{ env.REXAUTO_WORK }}/${{ steps.prep.outputs.project_name }}/*.log
          if-no-files-found: ignore
          retention-days: 14

  apk:
    name: "Android APK (arm64-v8a)"
    needs: recompile
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PROJECT_NAME: ${{ needs.recompile.outputs.project_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: port-src-${{ needs.recompile.outputs.project_name }}
          path: ${{ runner.temp }}/in

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: android/sdk
          key: android-sdk-v0.10.0-${{ hashFiles('android/patches/*.patch', 'tools/android_sdk.sh') }}

      - name: Build and verify Android APK
        env:
          REX_TITLE: ${{ needs.recompile.outputs.title }}
          REX_TITLE_ID: ${{ needs.recompile.outputs.title_id }}
          BASELINE_ARM: ${{ inputs.baseline_arm }}
        run: python3 tools/ci_main.py build-apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.recompile.outputs.project_name }}-android-apk
          path: ${{ runner.temp }}/${{ needs.recompile.outputs.project_name }}-android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Collect Android project sources
        if: always()
        run: python3 tools/ci_main.py collect-sources

      - name: Upload project sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ needs.recompile.outputs.project_name }}
          path: ${{ runner.temp }}/source-${{ needs.recompile.outputs.project_name }}
          retention-days: 14

      - name: Upload native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android-${{ needs.recompile.outputs.project_name }}
          path: |
            android/app/.cxx/**/*.log
            android/app/.cxx/**/CMakeOutput.log
            android/app/.cxx/**/CMakeError.log
          if-no-files-found: ignore
          retention-days: 14
